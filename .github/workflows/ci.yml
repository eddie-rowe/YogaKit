name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --dir src || true

      # Blocking, and deliberately with no `|| true` — unlike the step above it, which
      # 007 owns. RULE-C5 says the copy-lint gates the build; a copy-lint that cannot
      # fail is a claim, not a gate. See VOICE.md §6 for what it does not cover.
      - name: Copy-lint (voice)
        run: npm run lint:copy

      - name: Validate pose library
        run: npm run validate:poses

      # Blocking, deliberately with no `|| true` — 008 US4/FR-021: RULE-L7 (telemetry
      # carries page views, errors, and web vitals only, never practice content) had no
      # automated test before this feature. See coverageLimits() in
      # scripts/lib/telemetry-check.mjs for what it does not catch.
      - name: Telemetry content-free check
        run: npm run lint:telemetry

      - name: Unit tests (with coverage)
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile=junit.xml

      - name: Build
        run: npx next build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-placeholder' }}

      # Uploads whatever JUnit output the test run produced, purely for visibility in
      # Datadog Test Optimization. `continue-on-error: true` because an absent
      # DD_API_KEY (e.g. a fork PR with no repo secrets) must not fail the build over an
      # optional upload — NextMove learned this the hard way (docs/OBSERVABILITY.md).
      - name: Upload test results to Datadog
        if: always()
        continue-on-error: true
        run: npx @datadog/datadog-ci junit upload --service yogakit ./junit.xml
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: us5.datadoghq.com

  datadog-validate:
    # Manifest-only validation (FR-004) — never applies. Applying stays a deliberate
    # local `npm run datadog:apply`, per 008's plan: "No auto-apply from CI."
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Datadog manifests
        run: npm run datadog:validate

  db-verify:
    # RLS-assertion harness (T022, docs/design/002-schema.md §A/§D). Runs
    # against a bare Postgres service container — no Docker-in-Docker, no
    # Supabase CLI — since the script itself stubs the `auth` schema and
    # roles it needs (see scripts/verify-migrations.sh header comment).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Verify migrations (RLS assertions)
        run: bash scripts/verify-migrations.sh

  db-types-check:
    # Generated-types drift check (T016, research.md item 5). Needs a real
    # local Supabase stack (Docker), unlike db-verify's bare-Postgres harness,
    # because `supabase gen types` reads from the Supabase CLI's own project
    # state, not just a plain Postgres connection.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase and apply migrations
        run: npx supabase start

      - name: Check generated types for drift
        run: bash scripts/db-types-check.sh
