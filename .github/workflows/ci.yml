name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --dir src || true

      # Blocking, and deliberately with no `|| true` — unlike the step above it, which
      # 007 owns. RULE-C5 says the copy-lint gates the build; a copy-lint that cannot
      # fail is a claim, not a gate. See VOICE.md §6 for what it does not cover.
      - name: Copy-lint (voice)
        run: npm run lint:copy

      - name: Validate pose library
        run: npm run validate:poses

      # Blocking, deliberately with no `|| true` — 008 US4/FR-021: RULE-L7 (telemetry
      # carries page views, errors, and web vitals only, never practice content) had no
      # automated test before this feature. See coverageLimits() in
      # scripts/lib/telemetry-check.mjs for what it does not catch.
      - name: Telemetry content-free check
        run: npm run lint:telemetry

      # Datadog Test Optimization, via dd-trace's native instrumentation rather than
      # the JUnit XML upload this replaces. JUnit gives Datadog a file of pass/fail
      # lines; the tracer gives it a span per test, which is what test history, flaky
      # detection, and per-session code coverage are actually built on. Running both
      # would double-report every test, so the old upload step is gone rather than
      # kept "just in case".
      #
      # NODE_OPTIONS is set on this step alone and never at job level: it is read by
      # every Node process, including the `npm ci` above, where dd-trace does not
      # exist yet. Vitest is ESM-first, so it needs both hooks — `--import` for the
      # ESM graph and `-r` for the CJS one.
      #
      # No key (a fork PR, say) means no NODE_OPTIONS at all, so the tracer never
      # loads and the tests run exactly as they do locally. Same degrade-don't-abort
      # posture as every other optional Datadog step here (FR-025/SC-011).
      #
      # DD_ENV is `ci`, not `prod`. Every monitor in datadog/ queries `env:prod`
      # (datadog/README.md), so test runs landing there would corrupt production
      # signals with data from a machine nobody is practising on.
      - name: Unit tests (with coverage)
        run: npx vitest run --coverage
        env:
          NODE_OPTIONS: ${{ secrets.DD_API_KEY != '' && '--import dd-trace/register.js -r dd-trace/ci/init' || '' }}
          DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: us5.datadoghq.com
          DD_ENV: ci
          DD_SERVICE: yogakit
          DD_TEST_SESSION_NAME: unit-tests

      - name: Build
        run: npx next build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-placeholder' }}

      # Dropped with the JUnit upload it sat beside: the tracer above reports every
      # test as a span, so a second pass/fail file for the same run would double-count
      # it. The coverage upload below is kept — it feeds Datadog Code Coverage, which
      # is a different surface from the session's own lines_pct, and it costs nothing
      # when it has nothing to send.
      #
      # Publishes Vitest's LCOV report to Datadog Code Coverage. Independent of the
      # test step on purpose: the report may still exist when tests fail.
      - name: Upload code coverage to Datadog
        if: ${{ always() && hashFiles('coverage/lcov.info') != '' }}
        continue-on-error: true
        run: npx @datadog/datadog-ci coverage upload --service yogakit --format lcov ./coverage/lcov.info
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: us5.datadoghq.com

  datadog-sast:
    name: Datadog SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    steps:
      # Full history lets Datadog associate findings with the correct commit and
      # calculate pull-request changes. Fork PRs do not receive repository secrets,
      # so the scan is skipped there instead of failing an otherwise valid build.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan source code
        if: env.DD_API_KEY != '' && env.DD_APP_KEY != ''
        uses: DataDog/datadog-static-analyzer-github-action@v1
        with:
          dd_api_key: ${{ env.DD_API_KEY }}
          dd_app_key: ${{ env.DD_APP_KEY }}
          dd_site: us5.datadoghq.com

  datadog-sca:
    name: Datadog SCA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    steps:
      # SCA reads the committed dependency manifests and lockfiles; it does not
      # depend on the Vercel runtime or require dependencies to be installed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan open-source dependencies
        if: env.DD_API_KEY != '' && env.DD_APP_KEY != ''
        uses: DataDog/datadog-sca-github-action@main
        with:
          dd_api_key: ${{ env.DD_API_KEY }}
          dd_app_key: ${{ env.DD_APP_KEY }}
          dd_site: us5.datadoghq.com

  datadog-validate:
    # Manifest-only validation (FR-004) — never applies. Applying stays a deliberate
    # local `npm run datadog:apply`, per 008's plan: "No auto-apply from CI."
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Datadog manifests
        run: npm run datadog:validate

      # Provider secrets are unavailable to fork PRs, so structural validation runs
      # everywhere and the live signal check runs after changes reach main. It fails
      # when a referenced metric has no service:yogakit/env:prod series or when the
      # Vercel log drain has delivered nothing for 24 hours.
      - name: Validate live Datadog signals
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run datadog:validate-live
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: us5.datadoghq.com

  db-verify:
    # RLS-assertion harness (T022, docs/design/002-schema.md §A/§D). Runs
    # against a bare Postgres service container — no Docker-in-Docker, no
    # Supabase CLI — since the script itself stubs the `auth` schema and
    # roles it needs (see scripts/verify-migrations.sh header comment).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Verify migrations (RLS assertions)
        run: bash scripts/verify-migrations.sh

  db-types-check:
    # Generated-types drift check (T016, research.md item 5). Needs a real
    # local Supabase stack (Docker), unlike db-verify's bare-Postgres harness,
    # because `supabase gen types` reads from the Supabase CLI's own project
    # state, not just a plain Postgres connection.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. This job compares committed generated types
          # against freshly generated ones, so the generator's own version is
          # an input to the comparison: CLI 2.117.0 ships postgres-meta v0.99.0,
          # which parenthesizes five `extends` clauses v0.98.0 did not. On
          # `latest` that release failed an unrelated PR (#18) with a diff
          # containing no schema change at all. Bumping this pin and committing
          # the regenerated file is now a deliberate change, which is what a
          # drift check is for. See FRICTION.md.
          version: 2.117.0

      - name: Start Supabase and apply migrations
        run: supabase start

      - name: Check generated types for drift
        run: bash scripts/db-types-check.sh
