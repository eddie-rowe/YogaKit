name: Supabase branch

# Makes the Supabase platform's migration result gate the merge.
#
# Branching is enabled on the `yogakit` project, so the migrations in supabase/migrations
# are applied by Supabase itself — to a preview branch on every pull request, and to
# production when this repo's `main` is pushed. That is why there is no `supabase db push`
# job anywhere in this repo: the "Managing environments" guide's push workflow is the
# alternative for repos *without* the GitHub integration, and running both would race two
# writers against one schema_migrations table.
#
# What the platform does not do is fail the pull request. It publishes its result as a
# Check Run named "Supabase Preview", which is advisory. This job waits for that check and
# adopts its verdict, so a migration that will not apply cannot be merged.
#
# Marking "Supabase Preview" itself as a required status check is the trap this wrapper
# exists to avoid: with the integration's "Supabase changes only" option on, the check never
# posts for a pull request that touches nothing under supabase/, and such a pull request
# would then be unmergeable forever. The `paths` filter below is the same condition, so this
# job simply does not run on those.
#
# One load-bearing setting lives in the Supabase dashboard and is invisible from this repo:
# Integrations -> GitHub -> "Deploy to production". With it off, merging to `main` applies
# nothing and this whole file gates a deploy that never happens. Confirmed **on** by the repo
# owner, 2026-09-04. If migrations ever stop reaching production, check that before anything
# in here.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'supabase/**'

jobs:
  supabase-preview:
    runs-on: ubuntu-latest
    steps:
      # Community action, but the one Supabase's own branching docs specify, pinned to the
      # version they name.
      - uses: fountainhead/action-wait-for-check@v1.2.0
        id: check
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: Supabase Preview
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The platform clones the base project, applies every migration from scratch, and
          # seeds — several minutes on a cold start. The action's 600s default has been
          # observed to expire first.
          timeoutSeconds: 1800
          intervalSeconds: 20

      # Three outcomes, not two — established empirically on the pull request that added
      # this file (run 33887394914). It changed supabase/config.toml and no migration, and
      # the integration published the check with conclusion `skipped`: its own change
      # detection is narrower than the `paths` filter above, which is as coarse as
      # GitHub's path filters get. A skip is the platform saying there was nothing to
      # apply, so it passes.
      #
      # `timed_out` is treated as a failure on purpose. A gate that cannot tell you whether
      # the migrations applied is not a gate, and the cost of being wrong is not symmetric:
      # a false block costs a re-run, a false pass costs a broken production deploy. Since
      # the platform posts `skipped` rather than nothing when it declines to build a
      # branch, a timeout now means something actually went wrong.
      - name: Report the platform's verdict
        run: |
          echo "Supabase Preview concluded: ${{ steps.check.outputs.conclusion }}"
          case "${{ steps.check.outputs.conclusion }}" in
            success)
              echo "Migrations applied to the preview branch."
              ;;
            skipped)
              echo "The integration found nothing to apply on this pull request." >&2
              echo "Expected when supabase/ changed but supabase/migrations/ did not." >&2
              ;;
            failure)
              echo "A migration in supabase/migrations does not apply cleanly from" >&2
              echo "empty — open the Supabase Preview check for the SQL error." >&2
              exit 1
              ;;
            *)
              echo "Could not establish whether the migrations apply. If this is" >&2
              echo "timed_out, no preview branch was created for this pull request;" >&2
              echo "re-run this job." >&2
              exit 1
              ;;
          esac
