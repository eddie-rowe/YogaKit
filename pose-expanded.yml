                - generic [ref=e1276]: "Entering: Walk the hands forward on an exhale, allowing the sternum to descend toward the earth with the outgoing breath. Let each exhalation carry the heart a little closer to the floor without forcing."
                - generic [ref=e1277]: "Holding: Breathe deeply into the front of the chest, expanding the pectorals and intercostals with each inhale. Each exhale softens the thoracic spine further into extension. Allow the breath to become wide and spacious across the collarbones."
                - generic [ref=e1278]: "Exiting: On an inhale, press gently through the palms and walk the hands back, slowly restacking the spine into a neutral all-fours position."
            - generic [ref=e1279]:
              - heading "Teacher cues" [level=3] [ref=e1280]
              - paragraph [ref=e1281]: From all fours, walk the hands forward while keeping the hips stacked over the knees. Allow the chest to descend toward the floor, chin or forehead resting on the mat. Arms fully extend forward. The thoracic spine extends as the heart center melts down. A bolster under the chest can reduce intensity. Unlike Child's Pose, the hips stay elevated over the knees.
